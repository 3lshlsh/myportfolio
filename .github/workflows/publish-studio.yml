name: Publish portfolio and content studio

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'studio/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-studio.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'studio/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-studio.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Install Astro dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Astro site build using Sanity
        run: npm run build -- --site https://3lshlsh.github.io --base /myportfolio
        env:
          SANITY_PROJECT_ID: f61knmhk
          SANITY_DATASET: production
      - name: Install Studio dependencies
        run: npm ci --prefix studio --no-audit --no-fund
      - name: Verify Studio build
        run: npm --prefix studio run build
        env:
          SANITY_STUDIO_BASEPATH: /myportfolio/admin

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install Astro site dependencies
        run: npm ci --no-audit --no-fund
      - name: Build site from published Sanity content
        run: npm run build -- --site https://3lshlsh.github.io --base /myportfolio
        env:
          SANITY_PROJECT_ID: f61knmhk
          SANITY_DATASET: production
      - name: Install Studio dependencies
        run: npm ci --prefix studio --no-audit --no-fund
      - name: Build Sanity Studio
        run: npm --prefix studio run build
        env:
          SANITY_STUDIO_BASEPATH: /myportfolio/admin
      - name: Assemble site and Studio
        run: |
          mkdir -p dist/admin
          cp -r studio/dist/. dist/admin/
          cp studio/pages-404.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
